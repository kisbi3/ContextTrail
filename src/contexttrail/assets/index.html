<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ContextTrail · 근거 보기</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div><span class="eyebrow">CONTEXTTRAIL</span><h1>프로젝트의 흐름과 근거</h1></div><button id="refresh" disabled>변경분 분석</button></header>
<section id="statusbar"><span id="status">터미널에서 안내한 접근 주소로 열어 주세요.</span><span id="version"></span></section>
<main><section class="panel canvas"><div class="panel-heading"><h2>진행 흐름</h2><span>노드를 선택하면 오른쪽에 원문이 표시됩니다.</span></div><div id="graph"></div></section>
<aside class="panel"><div class="panel-heading"><h2>사건과 근거</h2></div><div id="detail"><p class="muted">사건을 선택하세요.</p></div></aside></main>
<section class="panel limitations"><h2>분석 범위와 한계</h2><div id="limits"></div></section>
<footer>저장된 그래프를 보고 있습니다. 페이지 새로고침은 AI 분석을 실행하지 않습니다. 점선 관계는 추정입니다.</footer>
</body></html>
